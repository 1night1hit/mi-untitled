<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="1N1H Maquetas" />
  <title>1N1H Maquetas</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --surface: #242424;
      --surface-light: #2f2f2f;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --accent-yellow: #e5ff00;
      --accent-green: #1db954;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 125px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 16px 20px;
    }

    /* Top Bar con botones circulares */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      position: relative;
    }
    .circle-btn:active { transform: scale(0.93); background: var(--surface-light); }
    .circle-btn.active { background: #ffffff; color: #000000; }
    .circle-btn.downloaded { background: rgba(29, 185, 84, 0.22); color: var(--accent-green); }

    .badge-one {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 9px;
      font-weight: 800;
      background: #000;
      color: #fff;
      border-radius: 50%;
      width: 12px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-right-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Buscador desplegable */
    .search-bar {
      display: none;
      margin-bottom: 16px;
    }
    .search-bar.open { display: block; }
    .search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    /* Barra de estado de descarga offline */
    .offline-banner {
      display: none;
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .offline-banner.visible { display: flex; }

    /* Portada con disco de vinilo asomando */
    .cover-stage {
      position: relative;
      width: 265px;
      height: 265px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
    }

    .vinyl-disc {
      position: absolute;
      right: -24px;
      width: 245px;
      height: 245px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        #111 0%, #111 18%,
        #4a4a4a 19%, #222 20%,
        #383838 35%, #181818 50%,
        #444 65%, #1c1c1c 80%,
        #555 95%, #222 100%
      );
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 1;
      transition: transform 0.6s ease;
    }
    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 45deg, transparent 0deg, rgba(255,255,255,0.18) 40deg, transparent 90deg, rgba(255,255,255,0.12) 210deg, transparent 270deg);
    }

    .cover-box {
      position: relative;
      width: 265px;
      height: 265px;
      border-radius: 16px;
      background: #000;
      overflow: hidden;
      z-index: 2;
      box-shadow: 0 14px 34px rgba(0,0,0,0.65);
      cursor: pointer;
    }
    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      gap: 6px;
      background: #1a1a1a;
    }

    /* Info del proyecto + botones de control principales */
    .project-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .project-titles {
      flex: 1;
      min-width: 0;
    }

    .project-title {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .project-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-controls-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .big-play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .big-play-btn:active { transform: scale(0.93); }

    /* Botones de acción (+ Add tracks y Modo Reordenar) */
    .actions-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .add-tracks-btn {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .add-tracks-btn:active { background: var(--surface-light); }
    .add-tracks-btn:disabled { opacity: 0.75; cursor: wait; }

    .reorder-toggle-btn {
      background: var(--surface);
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .reorder-toggle-btn.active {
      background: var(--accent-yellow);
      color: #000;
    }

    /* Lista de Tracks */
    .track-list {
      display: flex;
      flex-direction: column;
    }

    .track-row {
      display: flex;
      align-items: center;
      padding: 11px 6px;
      gap: 12px;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s, transform 0.15s;
    }
    .track-row:active { background: rgba(255,255,255,0.06); }
    .track-row.active { background: rgba(255,255,255,0.04); }
    .track-row.dragging {
      opacity: 0.45;
      background: var(--surface-light);
      border: 1px dashed var(--accent-yellow);
    }
    .track-row.drag-over {
      border-top: 2px solid var(--accent-yellow);
    }

    .track-index {
      width: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Barras de ecualizador animadas cuando suena */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }
    .eq-bars span {
      width: 2.5px;
      background: var(--accent-yellow);
      border-radius: 2px;
      animation: eq 0.8s infinite ease-in-out;
    }
    .eq-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .eq-bars span:nth-child(2) { height: 14px; animation-delay: 0.2s; }
    .eq-bars span:nth-child(3) { height: 9px; animation-delay: 0.4s; }
    .eq-bars span:nth-child(4) { height: 12px; animation-delay: 0.1s; }
    .eq-bars.paused span { animation: none; height: 5px; background: #fff; }

    @keyframes eq {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .track-row.active .track-title {
      font-weight: 700;
      color: #ffffff;
    }

    .track-sub-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .offline-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-green);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .track-dots-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .track-dots-btn:active { color: #fff; }

    /* Controles cuando el Modo Reordenar está activo */
    .reorder-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .reorder-arrow-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid #333;
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .reorder-arrow-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }
    .reorder-arrow-btn:active:not(:disabled) {
      background: var(--surface-light);
      transform: scale(0.92);
    }
    .drag-handle {
      color: var(--text-muted);
      padding: 6px 8px;
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
    }
    .drag-handle:active { cursor: grabbing; color: #fff; }

    /* Cápsula Reproductor Flotante Inferior Completa */
    .floating-player {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 446px;
      background: rgba(32, 32, 32, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 34px;
      padding: 8px 12px 8px 8px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.8);
      z-index: 90;
    }
    .floating-player.visible { display: flex; }

    .mini-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
      cursor: pointer;
    }
    .mini-disc.spinning {
      animation: spin 10s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .mini-meta {
      width: 102px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .mini-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .mini-time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Waveform interactivo amarillo */
    .waveform-wrap {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
      touch-action: none;
      padding: 4px 0;
    }
    .wave-bar {
      flex: 1;
      background: #555;
      border-radius: 2px;
      transition: background 0.08s;
    }
    .wave-bar.played {
      background: var(--accent-yellow);
    }

    /* Botones de Pausa y Siguiente en el reproductor inferior */
    .mini-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .mini-ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .mini-ctrl-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.18);
    }

    /* Modal / Action Sheet estilo iOS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }

    .action-sheet {
      width: 100%;
      max-width: 460px;
      background: #1e1e1e;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      margin: 0 auto 10px;
      flex-shrink: 0;
    }
    .sheet-header {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-btn {
      width: 100%;
      background: var(--surface);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .sheet-btn.danger { color: #ff453a; }
    .sheet-btn:active { background: var(--surface-light); }
  </style>
</head>
<body>

<div class="container">
  <!-- Barra superior -->
  <div class="top-bar">
    <button class="circle-btn" onclick="openProjectsSheet()" title="Cambiar proyecto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div class="top-right-group">
      <!-- Botón Descargar Playlist Offline -->
      <button class="circle-btn" id="downloadOfflineBtn" onclick="downloadEntirePlaylist()" title="Guardar playlist offline">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="circle-btn" onclick="shareProject()" title="Copiar link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </button>
      <button class="circle-btn" id="searchToggleBtn" onclick="toggleSearch()" title="Buscar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <button class="circle-btn" onclick="openProjectMenu()" title="Opciones del proyecto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </div>

  <!-- Banner progreso descarga offline -->
  <div class="offline-banner" id="offlineBanner">
    <span id="offlineBannerText">Descargando playlist...</span>
  </div>

  <!-- Buscador -->
  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Buscar track en este proyecto..." oninput="renderTracks()" />
  </div>

  <!-- Portada cuadrada + Vinilo -->
  <div class="cover-stage">
    <div class="vinyl-disc"></div>
    <div class="cover-box" onclick="document.getElementById('coverInput').click()">
      <img id="coverImg" style="display:none;" />
      <div id="coverPlaceholder" class="cover-placeholder">
        <span>+ Portada</span>
      </div>
    </div>
    <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="uploadCover(event)" />
  </div>

  <!-- Título, subtítulo y controles principales (Repetir, Aleatorio, Play/Pausa) -->
  <div class="project-meta-row">
    <div class="project-titles">
      <div class="project-title" id="projectTitleDisplay">Cargando...</div>
      <div class="project-subtitle" id="projectSubtitleDisplay">0 tracks</div>
    </div>
    <div class="play-controls-cluster">
      <button class="circle-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repetir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        <span id="repeatOneBadge" class="badge-one" style="display:none;">1</span>
      </button>
      <button class="circle-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aleatorio sin repetición">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>
      <button class="big-play-btn" id="mainPlayBtn" onclick="handleMainPlay()" title="Reproducir / Pausar">
        <svg id="mainPlayIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- Barra de acciones: "+ Add tracks" y botón de "Ordenar" -->
  <input 
    type="file" 
    id="audioFileInput" 
    accept=".mp3,.wav,audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave" 
    multiple 
    style="display:none;" 
    onchange="uploadFilesFromDevice(event)" 
  />
  <div class="actions-bar">
    <button class="add-tracks-btn" id="uploadBtn" onclick="document.getElementById('audioFileInput').click()">
      <span>+ Add tracks</span>
    </button>
    <button class="reorder-toggle-btn" id="reorderToggleBtn" onclick="toggleReorderMode()" title="Cambiar el orden de los tracks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span id="reorderBtnLabel">Ordenar</span>
    </button>
  </div>

  <!-- Lista de canciones -->
  <div id="trackList" class="track-list"></div>
</div>

<!-- Reproductor Flotante Inferior con Botón de Pausa/Play y Siguiente -->
<div class="floating-player" id="floatingPlayer">
  <img id="miniCover" class="mini-disc" src="icon.png" onclick="togglePlay()" />
  <div class="mini-meta" onclick="togglePlay()">
    <div class="mini-title" id="miniTitle">Track</div>
    <div class="mini-time" id="miniTime">0:00 / 0:00</div>
  </div>
  <div class="waveform-wrap" id="waveformWrap"></div>
  <div class="mini-controls">
    <button class="mini-ctrl-btn" id="miniPlayPauseBtn" onclick="togglePlay()" title="Pausar / Reproducir">
      <svg id="miniPlayPauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
    </button>
    <button class="mini-ctrl-btn" onclick="nextTrack()" title="Siguiente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
    </button>
  </div>

<script>

  // ==========================================
  // COLA ALEATORIA SIN REPETICIÓN (Algoritmo Fisher-Yates)
  // ==========================================
  function generateShuffleQueue(startTrackIndex = -1) {
    const indices = tracks.map((_, i) => i);
    if (indices.length === 0) {
      shuffleQueue = [];
      shufflePos = -1;
      return;
    }

    // Si hay una canción sonando o elegida para arrancar, ponerla primera en la cola
    let remaining = indices;
    if (startTrackIndex >= 0 && startTrackIndex < tracks.length) {
      remaining = indices.filter(i => i !== startTrackIndex);
    }

    // Mezclar el resto sin repeticiones con Fisher-Yates
    for (let i = remaining.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = remaining[i];
      remaining[i] = remaining[j];
      remaining[j] = temp;
    }

    if (startTrackIndex >= 0 && startTrackIndex < tracks.length) {
      shuffleQueue = [startTrackIndex, ...remaining];
      shufflePos = 0;
    } else {
      shuffleQueue = remaining;
      shufflePos = -1;
    }
  }

  // Calcula cuál es el próximo índice a reproducir (para pre-cargar en RAM y que no se corte en 2do plano)
  function peekNextTrackIndex() {
    if (tracks.length === 0) return -1;
    if (isShuffle) {
      if (shuffleQueue.length !== tracks.length) {
        generateShuffleQueue(currentIndex);
      }
      if (shufflePos + 1 < shuffleQueue.length) {
        return shuffleQueue[shufflePos + 1];
      }
      return shuffleQueue[0] ?? 0;
    } else {
      return (currentIndex + 1) % tracks.length;
    }
  }

  // ==========================================

  // ==========================================
  let cachedDriveToken = null;
  let tokenExpireTime = 0;
  let tokenPromise = null;

  async function getValidDriveToken(forceRefresh = false) {
    if (!forceRefresh && cachedDriveToken && Date.now() < tokenExpireTime) {
      return cachedDriveToken;
    }
    if (!forceRefresh && tokenPromise) {
      return tokenPromise;
    }

    tokenPromise = (async () => {
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getToken' })
        });
        const data = await res.json();

          return cachedDriveToken;
        }
      } catch (e) {
        console.error('Error obteniendo token de Apps Script:', e);
      } finally {
        tokenPromise = null;
      }
      return null;
    })();

    return tokenPromise;
  }

  // ==========================================
  // ALMACENAMIENTO OFFLINE PERSISTENTE (ArrayBuffer en IndexedDB)
  // ==========================================
  const IDB_NAME = '1n1h_offline_v2';
  const IDB_STORE = 'audio_files';
  let idbInstance = null;
  const memoryBlobUrls = {};
  const inFlightDownloads = {};
  const offlineSavedSet = new Set();

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  function openAudioDB() {
    if (idbInstance) return Promise.resolve(idbInstance);
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('No IndexedDB'));
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(IDB_STORE)) {
          database.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = () => {
        idbInstance = req.result;
        idbInstance.onclose = () => { idbInstance = null; };
        resolve(idbInstance);
      };
      req.onerror = () => reject(req.error);
    });
  }

  async function getBlobFromIDB(fileId) {
    try {
      const database = await openAudioDB();
      const record = await new Promise((resolve) => {
        const tx = database.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(fileId);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
      if (!record) return null;
      if (record.buffer && record.buffer.byteLength > 0) {
        return new Blob([record.buffer], { type: record.type || 'audio/wav' });
      }
      if (record instanceof Blob && record.size > 0) {
        return record;
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  async function saveBlobToIDB(fileId, blob) {
    try {
      const buffer = await blob.arrayBuffer();
      if (!buffer || buffer.byteLength === 0) return;
      const database = await openAudioDB();
      await new Promise((resolve, reject) => {
        const tx = database.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put({
          buffer: buffer,
          type: blob.type || 'audio/wav',
          savedAt: Date.now()
        }, fileId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      offlineSavedSet.add(fileId);
    } catch (e) {}
  }

  async function deleteBlobFromIDB(fileId) {
    try {
      const database = await openAudioDB();
      await new Promise((resolve) => {
        const tx = database.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(fileId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
      offlineSavedSet.delete(fileId);
      if (memoryBlobUrls[fileId]) {
        URL.revokeObjectURL(memoryBlobUrls[fileId]);
        delete memoryBlobUrls[fileId];
      }
    } catch (e) {}
  }

  async function syncOfflineStatus() {
    try {
      const database = await openAudioDB();
      const keys = await new Promise((resolve) => {
        const tx = database.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
      const keySet = new Set(keys.map(String));
      offlineSavedSet.clear();
      tracks.forEach(t => {
        if (keySet.has(String(t.drive_file_id))) {
          offlineSavedSet.add(t.drive_file_id);
        }
      });
      const dlBtn = document.getElementById('downloadOfflineBtn');
      const allSaved = tracks.length > 0 && tracks.every(t => offlineSavedSet.has(t.drive_file_id));
      dlBtn.classList.toggle('downloaded', allSaved);
    } catch (e) {}
  }

  // Hidrata en RAM los tracks guardados en IndexedDB para que el cambio en 2do plano de iOS sea 100% sincrónico
  async function hydrateOfflineBlobsIntoRAM() {
    for (const t of tracks) {
      if (offlineSavedSet.has(t.drive_file_id) && !memoryBlobUrls[t.drive_file_id]) {
        try {
          const blob = await getBlobFromIDB(t.drive_file_id);
          if (blob && blob.size > 0) {
            memoryBlobUrls[t.drive_file_id] = URL.createObjectURL(blob);
          }
        } catch (e) {}
      }
    }
  }

  async function fetchDriveAudioBlob(fileId) {
    let token = await getValidDriveToken(false);
    if (!token) {
      token = await getValidDriveToken(true);
    }
    if (!token) {
      throw new Error('No se pudo obtener autorización de Apps Script');
    }

    const driveUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&acknowledgeAbuse=true`;

    let res = await fetch(driveUrl, {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    if (res.status === 401 || res.status === 403) {
      const freshToken = await getValidDriveToken(true);
      if (freshToken) {
        res = await fetch(driveUrl, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + freshToken
          }
        });
      }
    }

    if (!res.ok) {
      throw new Error('Drive HTTP ' + res.status);
    }

    const b = await res.blob();
    if (!b || b.size === 0) {
      throw new Error('Archivo vacío');
    }

    return (!b.type || b.type === 'application/octet-stream')
      ? new Blob([b], { type: 'audio/wav' })
      : b;
  }

  async function getLocalPlayableUrl(fileId) {
    if (memoryBlobUrls[fileId]) return memoryBlobUrls[fileId];
    if (inFlightDownloads[fileId]) return inFlightDownloads[fileId];

    inFlightDownloads[fileId] = (async () => {
      let blob = await getBlobFromIDB(fileId);

      if (!blob || blob.size === 0) {
        blob = await fetchDriveAudioBlob(fileId);
        await saveBlobToIDB(fileId, blob);
      } else {
        offlineSavedSet.add(fileId);
      }

      const blobUrl = URL.createObjectURL(blob);
      memoryBlobUrls[fileId] = blobUrl;
      delete inFlightDownloads[fileId];
      return blobUrl;
    })();

    try {
      return await inFlightDownloads[fileId];
    } catch (err) {
      delete inFlightDownloads[fileId];
      throw err;
    }
  }

  // Pre-carga en RAM el próximo track real (según orden normal o según la cola aleatoria)
  function preloadUpcomingTracks() {
    if (tracks.length <= 1 || isDownloadingOffline) return;
    const nextIdx = peekNextTrackIndex();
    if (nextIdx === -1) return;

    const nextTrackObj = tracks[nextIdx];
    if (nextTrackObj && !memoryBlobUrls[nextTrackObj.drive_file_id] && !inFlightDownloads[nextTrackObj.drive_file_id]) {
      getLocalPlayableUrl(nextTrackObj.drive_file_id)
        .then(() => {
          syncOfflineStatus();
          renderTracks();
        })
        .catch(() => {});
    }
  }

  async function downloadEntirePlaylist() {
    if (isDownloadingOffline || tracks.length === 0) return;

    await syncOfflineStatus();
    const missingTracks = tracks.filter(t => !offlineSavedSet.has(t.drive_file_id));

    if (missingTracks.length === 0) {
      if (confirm('Todos los tracks de esta playlist ya están guardados offline en tu dispositivo.\n\n¿Querés borrar las descargas para liberar espacio?')) {
        for (const t of tracks) {
          await deleteBlobFromIDB(t.drive_file_id);

        await syncOfflineStatus();
        renderTracks();
      }
      return;
    }

    isDownloadingOffline = true;
    const banner = document.getElementById('offlineBanner');
    const bannerText = document.getElementById('offlineBannerText');
    banner.classList.add('visible');

    let completed = tracks.length - missingTracks.length;
    for (let i = 0; i < missingTracks.length; i++) {
      const t = missingTracks[i];
      bannerText.textContent = `Guardando offline (${completed + 1}/${tracks.length}): ${t.title}...`;
      try {
        await getLocalPlayableUrl(t.drive_file_id);
        completed++;
        await syncOfflineStatus();
        renderTracks();
      } catch (err) {

    isDownloadingOffline = false;
    await syncOfflineStatus();

    if (completed === tracks.length) {
      bannerText.textContent = `✓ Los ${tracks.length} tracks quedaron guardados en tu dispositivo`;
    } else {
      bannerText.textContent = `✓ ${completed} de ${tracks.length} tracks guardados (tocá ↓ para completar)`;
    }
    setTimeout(() => banner.classList.remove('visible'), 3500);
  }

  // ==========================================
  // FORMA DE ONDA Y CONTROLES DE TIEMPO
  // ==========================================
  const waveHeights = [25, 45, 70, 40, 85, 60, 30, 90, 100, 65, 50, 80, 95, 45, 60, 75, 40, 85, 55, 35, 70, 90, 50, 65, 80, 40, 60, 30];
  function buildWaveform() {
    const wrap = document.getElementById('waveformWrap');
    wrap.innerHTML = '';

  const waveWrap = document.getElementById('waveformWrap');
  let isSeeking = false;

  function formatSeconds(sec) {
    if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function updateTimeDisplay() {
    const cur = formatSeconds(audio.currentTime);
    const dur = formatSeconds(audio.duration);
    document.getElementById('miniTime').textContent = `${cur} / ${dur}`;
  }

  function applySeekFromClientX(clientX) {
    if (!audio.duration || isNaN(audio.duration)) return;
    const rect = waveWrap.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    audio.currentTime = pct * audio.duration;
    updateWaveformProgress(pct);
    updateTimeDisplay();
    updatePositionState();
  }

  waveWrap.addEventListener('pointerdown', (e) => {
    isSeeking = true;
    waveWrap.setPointerCapture(e.pointerId);
    applySeekFromClientX(e.clientX);
  });
  waveWrap.addEventListener('pointermove', (e) => {
    if (isSeeking) applySeekFromClientX(e.clientX);
  });
  waveWrap.addEventListener('pointerup', (e) => {
    if (isSeeking) {
      isSeeking = false;
      waveWrap.releasePointerCapture(e.pointerId);
    }
  });

  function updateWaveformProgress(pct) {
    const bars = document.querySelectorAll('.wave-bar');
    const activeCount = Math.floor(pct * bars.length);
    bars.forEach((b, i) => {
      b.classList.toggle('played', i <= activeCount && pct > 0);
    });
  }

  // ==========================================
  // CARGA DE PROYECTO, LISTA Y REORDENAMIENTO DE TRACKS
  // ==========================================
  async function init() {
    getValidDriveToken().catch(() => {});

    const urlParams = new URLSearchParams(window.location.search);
    const sharedProjectId = urlParams.get('p');

    const { data: projects } = await db.from('projects').select('*').order('created_at', { ascending: false });
    allProjects = projects || [];

    if (allProjects.length === 0) {
      await createNewProject('1N1H Maquetas');
      return;
    }

    const exists = allProjects.some(p => p.id === sharedProjectId);
    const initialId = (sharedProjectId && exists) ? sharedProjectId : allProjects[0].id;
    await loadProject(initialId);
  }

  async function loadProject(projectId) {
    const { data: project } = await db.from('projects').select('*').eq('id', projectId).single();
    if (!project) return;
    currentProject = project;

    document.getElementById('projectTitleDisplay').textContent = project.title;

    const coverImg = document.getElementById('coverImg');
    const placeholder = document.getElementById('coverPlaceholder');
    if (project.cover_url) {
      coverImg.src = project.cover_url;
      coverImg.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      coverImg.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    const { data: trackData } = await db
      .from('tracks')
      .select('*')
      .eq('project_id', projectId)
      .order('track_order', { ascending: true })
      .order('created_at', { ascending: true });

    tracks = trackData || [];
    if (isShuffle) {
      generateShuffleQueue(currentIndex);
    }

    const artistText = project.artist ? `${project.artist} · ` : '';
    document.getElementById('projectSubtitleDisplay').textContent = `${artistText}${tracks.length} tracks`;

    await syncOfflineStatus();
    renderTracks();
    // Cargar en segundo plano los Blobs guardados en IndexedDB a la memoria RAM para reproducción continua sin cortes
    hydrateOfflineBlobsIntoRAM().catch(() => {});
  }

  function formatRelativeDate(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    const diffMs = Date.now() - date.getTime();
    const diffMins = Math.floor(diffMs / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}m ago`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h ago`;
    return date.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
  }

  function renderTracks() {
    const list = document.getElementById('trackList');
    const filter = document.getElementById('searchInput').value.toLowerCase().trim();
    list.innerHTML = '';

    tracks.forEach((t, idx) => {
      if (!isReorderMode && filter && !t.title.toLowerCase().includes(filter)) return;

      const isCurrent = idx === currentIndex;
      const isPaused = audio.paused;
      const isSavedOffline = offlineSavedSet.has(t.drive_file_id);

      const row = document.createElement('div');
      row.className = `track-row ${isCurrent ? 'active' : ''}`;
      row.dataset.index = idx;

      if (isReorderMode) {
        row.draggable = true;
        row.addEventListener('dragstart', (e) => onDragStart(e, idx, row));
        row.addEventListener('dragover', (e) => onDragOver(e, idx, row));
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', (e) => onDrop(e, idx));
        row.addEventListener('dragend', () => onDragEnd());
      } else {
        row.onclick = () => selectTrackFromList(idx);
      }

      const indexHtml = (isCurrent && !isReorderMode)
        ? `<div class="eq-bars ${isPaused ? 'paused' : ''}"><span></span><span></span><span></span><span></span></div>`
        : `${idx + 1}`;

      const offlineBadge = isSavedOffline ? `<span class="offline-dot" title="Guardado en dispositivo">↓</span>` : '';

      const rightControlsHtml = isReorderMode
        ? `
          <div class="reorder-controls" onclick="event.stopPropagation()">
            <button class="reorder-arrow-btn" onclick="swapTrackInMemory(${idx}, ${idx - 1})" ${idx === 0 ? 'disabled' : ''} title="Subir">↑</button>
            <button class="reorder-arrow-btn" onclick="swapTrackInMemory(${idx}, ${idx + 1})" ${idx === tracks.length - 1 ? 'disabled' : ''} title="Bajar">↓</button>
            <div class="drag-handle" onpointerdown="startTouchReorder(event, ${idx})" title="Arrastrar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg>
            </div>
          </div>
        `
        : `
          <button class="track-dots-btn" onclick="event.stopPropagation(); openTrackMenu(${idx})" title="Opciones">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        `;

      row.innerHTML = `
        <div class="track-index">${indexHtml}</div>
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-sub-row">
            ${offlineBadge}
            <span>${isLoadingTrack && isCurrent ? 'Cargando maqueta...' : formatRelativeDate(t.created_at)}</span>
          </div>
        </div>
        ${rightControlsHtml}
      `;
      list.appendChild(row);
    });
  }

  // Cuando el usuario toca manualmente una canción de la lista
  function selectTrackFromList(idx) {
    if (isShuffle) {
      // Si está en modo aleatorio, armamos una nueva cola sin repetición empezando por la canción que tocó
      generateShuffleQueue(idx);
    }
    playFromIndex(idx);
  }

  // ==========================================
  // FUNCIONES PARA REORDENAR TRACKS
  // ==========================================
  async function toggleReorderMode() {
    const btn = document.getElementById('reorderToggleBtn');
    const label = document.getElementById('reorderBtnLabel');

    if (!isReorderMode) {
      isReorderMode = true;
      hasOrderChanges = false;
      document.getElementById('searchBar').classList.remove('open');
      document.getElementById('searchInput').value = '';
      btn.classList.add('active');
      label.textContent = '✓ Guardar';
      renderTracks();
    } else {
      label.textContent = 'Guardando...';
      btn.disabled = true;
      if (hasOrderChanges) {
        await persistAllTrackOrders();
        if (isShuffle) generateShuffleQueue(currentIndex);
      }
      isReorderMode = false;
      hasOrderChanges = false;
      btn.disabled = false;
      btn.classList.remove('active');
      label.textContent = 'Ordenar';
      renderTracks();
    }
  }

  function swapTrackInMemory(fromIdx, toIdx) {
    if (toIdx < 0 || toIdx >= tracks.length || fromIdx === toIdx) return;

    const playingTrackId = currentIndex !== -1 ? tracks[currentIndex]?.id : null;
    const [movedItem] = tracks.splice(fromIdx, 1);
    tracks.splice(toIdx, 0, movedItem);

    if (playingTrackId) {
      currentIndex = tracks.findIndex(t => t.id === playingTrackId);
    }

    hasOrderChanges = true;
    renderTracks();
  }

  async function persistAllTrackOrders() {
    try {
      const updates = tracks.map((t, index) => {
        t.track_order = index;
        return db.from('tracks').update({ track_order: index }).eq('id', t.id);
      });
      await Promise.all(updates);
    } catch (e) {
      console.error('Error guardando el nuevo orden:', e);
    }
  }

  function onDragStart(e, idx, row) {
    draggedIdx = idx;
    setTimeout(() => row.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  }

  function onDragOver(e, idx, row) {
    e.preventDefault();
    if (draggedIdx === null || draggedIdx === idx) return;
    row.classList.add('drag-over');
  }

  function onDrop(e, targetIdx) {
    e.preventDefault();
    if (draggedIdx === null || draggedIdx === targetIdx) return;
    swapTrackInMemory(draggedIdx, targetIdx);
    draggedIdx = null;
  }

  function onDragEnd() {
    draggedIdx = null;
    document.querySelectorAll('.track-row').forEach(r => {
      r.classList.remove('dragging', 'drag-over');
    });
  }

  function startTouchReorder(e, startIdx) {
    e.preventDefault();
    let currentDragIdx = startIdx;
    const rows = Array.from(document.querySelectorAll('.track-row'));
    if (rows[currentDragIdx]) rows[currentDragIdx].classList.add('dragging');

    function onPointerMove(moveEvent) {
      const el = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
      const targetRow = el ? el.closest('.track-row') : null;
      if (targetRow && targetRow.dataset.index !== undefined) {
        const overIdx = parseInt(targetRow.dataset.index, 10);
        if (!isNaN(overIdx) && overIdx !== currentDragIdx) {
          swapTrackInMemory(currentDragIdx, overIdx);
          currentDragIdx = overIdx;
          const updatedRows = Array.from(document.querySelectorAll('.track-row'));
          if (updatedRows[currentDragIdx]) updatedRows[currentDragIdx].classList.add('dragging');
        }
      }
    }

    function onPointerUp() {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      document.querySelectorAll('.track-row').forEach(r => r.classList.remove('dragging'));
    }

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // ==========================================
  // MOTOR DE REPRODUCCIÓN (Optimizado para Background Audio en iOS)
  // ==========================================
  async function playFromIndex(idx) {
    if (tracks.length === 0 || idx < 0 || idx >= tracks.length) return;

    // Si tocás el mismo track que ya está sonando, reinicia desde 0:00
    if (idx === currentIndex && audio.src && audio.src.startsWith('blob:') && !isLoadingTrack) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      updateWaveformProgress(0);
      updateTimeDisplay();
      updatePositionState();
      syncPlayIcons();
      renderTracks();
      return;
    }

    const requestId = ++activePlayRequestId;
    currentIndex = idx;
    const track = tracks[currentIndex];
    const cachedRamUrl = memoryBlobUrls[track.drive_file_id];

    document.getElementById('floatingPlayer').classList.add('visible');
    document.getElementById('miniTitle').textContent = track.title;
    document.getElementById('miniCover').src = currentProject.cover_url || 'icon.png';
    updateWaveformProgress(0);

    // RUTA RÁPIDA SINCRÓNICA (Fundamental para que iOS NO corte la música cuando pasa al siguiente tema con pantalla bloqueada)
    if (cachedRamUrl) {
      isLoadingTrack = false;
      audio.src = cachedRamUrl;
      audio.currentTime = 0;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch((e) => console.warn('Play error:', e));
      }
      updateMediaSession(track);
      syncPlayIcons();
      renderTracks();
      updatePositionState();
      preloadUpcomingTracks();
      return;
    }

    // RUTA ASÍNCRONA (Si el track todavía no estaba en RAM y hay que leerlo de IndexedDB o Drive)
    isLoadingTrack = true;
    document.getElementById('miniTime').textContent = 'Cargando...';
    syncPlayIcons();
    renderTracks();

    try {
      const localUrl = await getLocalPlayableUrl(track.drive_file_id);
      if (requestId !== activePlayRequestId) return;

      isLoadingTrack = false;
      audio.src = localUrl;
      audio.currentTime = 0;
      await audio.play();

      updateMediaSession(track);
      await syncOfflineStatus();
      syncPlayIcons();
      renderTracks();
      updatePositionState();
      preloadUpcomingTracks();
    } catch (err) {
      if (requestId !== activePlayRequestId) return;
      console.error('Error reproduciendo track:', err);
      isLoadingTrack = false;
      syncPlayIcons();
      renderTracks();
      document.getElementById('miniTime').textContent = 'Tocá ▶ para reintentar';
    }
  }

  function handleMainPlay() {
    if (tracks.length === 0) return;
    if (currentIndex === -1) {
      if (isShuffle) {
        generateShuffleQueue(-1);
        nextTrack();
      } else {
        playFromIndex(0);
      }
    } else {
      togglePlay();
    }
  }

  function togglePlay() {
    if (tracks.length === 0) return;
    if (currentIndex === -1) {
      handleMainPlay();
      return;
    }
    if (!audio.src || !audio.src.startsWith('blob:')) {
      playFromIndex(currentIndex);
      return;
    }
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
    syncPlayIcons();
    renderTracks();
    updatePositionState();
  }

  function syncPlayIcons() {
    const isPlaying = !audio.paused && Boolean(audio.src) && audio.src.startsWith('blob:');
    const pauseSvg = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
    const playSvg = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';

    document.getElementById('mainPlayIcon').innerHTML = isPlaying ? pauseSvg : playSvg;
    document.getElementById('miniPlayPauseIcon').innerHTML = isPlaying ? pauseSvg : playSvg;
    document.getElementById('miniCover').classList.toggle('spinning', isPlaying);

    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
    }
  }

  function toggleShuffle() {
    isShuffle = !isShuffle;
    document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
    if (isShuffle) {
      // Armar el mazo mezclado sin repeticiones dejando la canción actual como la primera
      generateShuffleQueue(currentIndex);
      preloadUpcomingTracks();
    } else {
      shuffleQueue = [];
      shufflePos = -1;
      preloadUpcomingTracks();
    }
  }

  function toggleRepeat() {
    repeatMode = (repeatMode + 1) % 3;
    const btn = document.getElementById('repeatBtn');
    const badge = document.getElementById('repeatOneBadge');
    btn.classList.toggle('active', repeatMode > 0);
    badge.style.display = repeatMode === 2 ? 'flex' : 'none';
  }

  function nextTrack() {
    if (tracks.length === 0) return;

    if (isShuffle) {
      if (shuffleQueue.length !== tracks.length) {
        generateShuffleQueue(currentIndex);
      }
      shufflePos++;
      // Si ya sonaron TODAS las canciones sin repetir ninguna, barajamos un mazo nuevo
      if (shufflePos >= shuffleQueue.length) {
        const lastPlayed = currentIndex;
        generateShuffleQueue(-1);
        // Evitar que la primera del nuevo mazo sea justo la última que acaba de terminar
        if (shuffleQueue.length > 1 && shuffleQueue[0] === lastPlayed) {
          const swapIdx = 1 + Math.floor(Math.random() * (shuffleQueue.length - 1));
          const tmp = shuffleQueue[0];
          shuffleQueue[0] = shuffleQueue[swapIdx];
          shuffleQueue[swapIdx] = tmp;
        }
        shufflePos = 0;
      }
      playFromIndex(shuffleQueue[shufflePos]);
    } else {
      const nextIdx = (currentIndex + 1) % tracks.length;
      playFromIndex(nextIdx);
    }
  }

  function prevTrack() {
    if (tracks.length === 0) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      updatePositionState();
      return;
    }

    if (isShuffle && shuffleQueue.length === tracks.length) {
      if (shufflePos > 0) {
        shufflePos--;
        playFromIndex(shuffleQueue[shufflePos]);
      } else {
        audio.currentTime = 0;
        updatePositionState();
      }
    } else {
      playFromIndex((currentIndex - 1 + tracks.length) % tracks.length);
    }
  }

  audio.addEventListener('ended', () => {
    if (repeatMode === 2) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    } else {
      nextTrack();
    }
  });

  audio.addEventListener('play', () => { syncPlayIcons(); renderTracks(); updatePositionState(); });
  audio.addEventListener('pause', () => { syncPlayIcons(); renderTracks(); updatePositionState(); });
  audio.addEventListener('loadedmetadata', () => { updateTimeDisplay(); updatePositionState(); });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration || isSeeking) return;
    const pct = audio.currentTime / audio.duration;
    updateWaveformProgress(pct);
    updateTimeDisplay();
  });

  function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
      if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration) && audio.duration > 0) {
        try {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate || 1,
            position: Math.min(Math.max(0, audio.currentTime || 0), audio.duration)
          });
        } catch (e) {}
      }
    }
  }

  // ==========================================
  // MENÚS Y GESTIÓN DE TRACKS / PROYECTOS
  // ==========================================
  function openModal(html) {
    document.getElementById('actionSheet').innerHTML = `<div class="sheet-handle"></div>` + html;
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  function openTrackMenu(idx) {
    const track = tracks[idx];
    openModal(`
      <div class="sheet-header">#${idx + 1} · ${escapeHtml(track.title)}</div>
      <button class="sheet-btn" onclick="promptRenameTrack(${idx})">Renombrar track</button>
      ${idx > 0 ? `<button class="sheet-btn" onclick="moveTrackSingleStep(${idx}, ${idx - 1})">↑ Subir una posición (al #${idx})</button>` : ''}
      ${idx < tracks.length - 1 ? `<button class="sheet-btn" onclick="moveTrackSingleStep(${idx}, ${idx + 1})">↓ Bajar una posición (al #${idx + 2})</button>` : ''}
      ${tracks.length > 1 ? `<button class="sheet-btn" onclick="promptMoveToPosition(${idx})">Mover a la posición #...</button>` : ''}
      ${tracks.length > 1 ? `<button class="sheet-btn" onclick="closeModal(); toggleReorderMode()">Reordenar varios tracks (Modo Ordenar)</button>` : ''}
      <button class="sheet-btn" onclick="downloadSingleTrackFile(${idx})">Descargar archivo de audio</button>
      <button class="sheet-btn danger" onclick="deleteTrack('${track.id}')">Eliminar del proyecto</button>
    `);
  }

  async function moveTrackSingleStep(fromIdx, toIdx) {
    closeModal();
    swapTrackInMemory(fromIdx, toIdx);
    await persistAllTrackOrders();
    if (isShuffle) generateShuffleQueue(currentIndex);
    hasOrderChanges = false;
  }

  async function promptMoveToPosition(fromIdx) {
    closeModal();
    const input = prompt(`¿A qué número de posición (1 a ${tracks.length}) querés mover "${tracks[fromIdx].title}"?`, String(fromIdx + 1));
    if (!input) return;
    const targetPos = parseInt(input, 10);
    if (isNaN(targetPos) || targetPos < 1 || targetPos > tracks.length) {
      alert(`Ingresá un número entre 1 y ${tracks.length}.`);
      return;
    }
    const toIdx = targetPos - 1;
    if (toIdx === fromIdx) return;

    swapTrackInMemory(fromIdx, toIdx);
    await persistAllTrackOrders();
    if (isShuffle) generateShuffleQueue(currentIndex);
    hasOrderChanges = false;
  }

  async function promptRenameTrack(idx) {
    closeModal();
    const track = tracks[idx];
    const newTitle = prompt('Nuevo nombre del track:', track.title);
    if (!newTitle || !newTitle.trim()) return;
    await db.from('tracks').update({ title: newTitle.trim() }).eq('id', track.id);
    await loadProject(currentProject.id);
    if (currentIndex === idx) {
      document.getElementById('miniTitle').textContent = newTitle.trim();
    }
  }

  async function downloadSingleTrackFile(idx) {
    closeModal();
    const track = tracks[idx];
    try {
      const blobUrl = await getLocalPlayableUrl(track.drive_file_id);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = track.title;
      document.body.appendChild(a);
      a.click();
      a.remove();
      await syncOfflineStatus();
      renderTracks();
    } catch (e) {
      alert('Error al descargar el archivo.');
    }
  }

  async function deleteTrack(trackId) {
    closeModal();
    if (!confirm('¿Eliminar este track del proyecto?')) return;
    await db.from('tracks').delete().eq('id', trackId);
    if (currentIndex !== -1 && tracks[currentIndex]?.id === trackId) {
      audio.pause();
      audio.removeAttribute('src');
      currentIndex = -1;
      document.getElementById('floatingPlayer').classList.remove('visible');
    }
    await loadProject(currentProject.id);
    await persistAllTrackOrders();
  }

  function openProjectMenu() {
    openModal(`
      <div class="sheet-header">${escapeHtml(currentProject.title)}</div>
      <button class="sheet-btn" onclick="closeModal(); toggleReorderMode()">Reordenar lista de tracks</button>
      <button class="sheet-btn" onclick="closeModal(); downloadEntirePlaylist()">Guardar playlist offline en dispositivo</button>
      <button class="sheet-btn" onclick="promptRenameProject()">Cambiar nombre del proyecto</button>
      <button class="sheet-btn" onclick="promptChangeArtist()">Cambiar nombre de artista</button>
      <button class="sheet-btn" onclick="closeModal(); document.getElementById('coverInput').click()">Cambiar portada</button>
      ${allProjects.length > 1 ? `<button class="sheet-btn danger" onclick="deleteCurrentProject()">Eliminar proyecto completo</button>` : ''}
    `);
  }

  async function promptRenameProject() {
    closeModal();
    const title = prompt('Nombre del proyecto:', currentProject.title);
    if (!title || !title.trim()) return;
    await db.from('projects').update({ title: title.trim() }).eq('id', currentProject.id);
    await init();
  }

  async function promptChangeArtist() {
    closeModal();
    const artist = prompt('Nombre del artista:', currentProject.artist || '');
    if (artist === null) return;
    await db.from('projects').update({ artist: artist.trim() }).eq('id', currentProject.id);
    await loadProject(currentProject.id);
  }

  async function deleteCurrentProject() {
    closeModal();
    if (!confirm(`¿Seguro que querés eliminar el proyecto "${currentProject.title}" y toda su lista?`)) return;
    await db.from('projects').delete().eq('id', currentProject.id);
    window.history.replaceState({}, '', window.location.pathname);
    await init();
  }

  function openProjectsSheet() {
    let itemsHtml = `<div class="sheet-header">Tus Proyectos</div>`;
    allProjects.forEach(p => {
      const mark = p.id === currentProject.id ? ' ✓' : '';
      itemsHtml += `<button class="sheet-btn" onclick="closeModal(); selectProject('${p.id}')">${escapeHtml(p.title)}${mark}</button>`;
    });
    itemsHtml += `<button class="sheet-btn" style="text-align:center; font-weight:700; margin-top:4px;" onclick="closeModal(); createNewProject()">+ Nuevo Proyecto</button>`;
    openModal(itemsHtml);
  }

  async function selectProject(id) {
    if (isReorderMode) await toggleReorderMode();
    audio.pause();
    audio.removeAttribute('src');
    currentIndex = -1;
    document.getElementById('floatingPlayer').classList.remove('visible');
    window.history.replaceState({}, '', `?p=${id}`);
    await loadProject(id);
  }

  async function createNewProject(defaultName) {
    const title = defaultName || prompt('Nombre del nuevo proyecto:');
    if (!title || !title.trim()) return;
    const { data } = await db.from('projects').insert({ title: title.trim(), artist: 'Fran' }).select().single();
    if (data) {
      window.history.replaceState({}, '', `?p=${data.id}`);
      await init();
    }
  }

  function toggleSearch() {
    if (isReorderMode) return;
    const bar = document.getElementById('searchBar');
    bar.classList.toggle('open');
    if (bar.classList.contains('open')) {
      document.getElementById('searchInput').focus();
    } else {
      document.getElementById('searchInput').value = '';
      renderTracks();
    }
  }

  // ==========================================
  // SUBIDA DIRECTA CON GUARDADO OFFLINE AUTOMÁTICO
  // ==========================================
  function uploadBinaryWithProgress(uploadUrl, file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', uploadUrl, true);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress(Math.round((e.loaded / e.total) * 100));
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(JSON.parse(xhr.responseText));
        } else {
          reject(new Error('Error HTTP ' + xhr.status));
        }
      };
      xhr.onerror = () => reject(new Error('Error de red al subir a Google Drive'));
      xhr.send(file);
    });
  }

  async function uploadFilesFromDevice(event) {
    const files = Array.from(event.target.files);
    if (!files.length || !currentProject) return;

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = file.name.split('.').pop().toLowerCase();

      if (ext !== 'mp3' && ext !== 'wav') {
        alert(`El archivo "${file.name}" no es MP3 ni WAV.`);
        continue;
      }

      btn.textContent = `Preparando ${i + 1} de ${files.length}...`;

      try {
        const mimeType = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';

        const initRes = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            fileName: file.name,
            mimeType: mimeType
          })
        });
        const initData = await initRes.json();

        if (initData.token) {
          cachedDriveToken = initData.token;
          tokenExpireTime = Date.now() + 45 * 60 * 1000;
        }

        if (initData.status !== 'ok' || !initData.uploadUrl) {
          throw new Error(initData.message || 'No se pudo iniciar la subida');
        }

        const driveFile = await uploadBinaryWithProgress(initData.uploadUrl, file, (pct) => {
          btn.textContent = `Subiendo ${i + 1}/${files.length}: ${pct}%`;
        });

        await saveBlobToIDB(driveFile.id, file);
        memoryBlobUrls[driveFile.id] = URL.createObjectURL(file);

        const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
        await db.from('tracks').insert({
          project_id: currentProject.id,
          title: cleanTitle,
          drive_file_id: driveFile.id,
          track_order: tracks.length + i
        });

      } catch (err) {
        alert('Error subiendo ' + file.name + ': ' + err.message);
      }
    }

    btn.disabled = false;
    btn.textContent = '+ Add tracks';
    event.target.value = '';
    await loadProject(currentProject.id);
  }

  async function uploadCover(event) {
    const file = event.target.files[0];
    if (!file || !currentProject) return;

    const filePath = `${currentProject.id}-${Date.now()}.jpg`;
    const { error } = await db.storage.from('covers').upload(filePath, file);
    if (error) {
      alert('Error subiendo portada: ' + error.message);
      return;
    }

    const { data: publicUrlData } = db.storage.from('covers').getPublicUrl(filePath);
    await db.from('projects').update({ cover_url: publicUrlData.publicUrl }).eq('id', currentProject.id);
    await loadProject(currentProject.id);
  }

  // Controles de pantalla de bloqueo iOS (con botones de Anterior/Siguiente canción en vez de ±10s)
  function updateMediaSession(track) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: currentProject.artist || '1N1H',
        album: currentProject.title,
        artwork: currentProject.cover_url ? [{ src: currentProject.cover_url, sizes: '512x512', type: 'image/jpeg' }] : []
      });

      navigator.mediaSession.setActionHandler('play', () => {
        audio.play().catch(() => {});
        syncPlayIcons();
        renderTracks();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        audio.pause();
        syncPlayIcons();
        renderTracks();
      });

      // IMPORTANTE EN iOS: Registrar previoustrack y nexttrack y poner seekbackward/seekforward en null
      // obliga a iOS a mostrar los botones de cambiar canción (⏮ ⏭) en vez de los de ±10 segundos.
      try { navigator.mediaSession.setActionHandler('seekbackward', null); } catch (e) {}
      try { navigator.mediaSession.setActionHandler('seekforward', null); } catch (e) {}

      navigator.mediaSession.setActionHandler('previoustrack', () => {
        prevTrack();
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        nextTrack();
      });

      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.fastSeek && 'fastSeek' in audio) {
          audio.fastSeek(details.seekTime);
        } else {
          audio.currentTime = details.seekTime;
        }
        if (audio.duration) {
          updateWaveformProgress(audio.currentTime / audio.duration);
        }
        updateTimeDisplay();
        updatePositionState();
      });
    }
  }

  function shareProject() {
    const url = `${window.location.origin}${window.location.pathname}?p=${currentProject.id}`;
    navigator.clipboard.writeText(url);
    alert('Link copiado:\n' + url);
  }

  init();
</script>
