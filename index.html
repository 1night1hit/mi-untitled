<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="1N1H Maquetas" />
  <title>1N1H Maquetas</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1f1f1f;
      --text: #f5f5f5;
      --text-muted: #737373;
      --accent: #ffffff;
      --border: #262626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 120px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    /* Header / Nav */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 8px;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      max-width: 180px;
      text-overflow: ellipsis;
    }
    .btn-ghost:hover { background: var(--surface-hover); }

    /* Portada Cuadrada estilo [untitled] */
    .project-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .cover-wrapper {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      margin-bottom: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }

    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      gap: 8px;
    }

    /* Inputs editables sin bordes */
    .editable-title {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      width: 100%;
      outline: none;
      padding: 4px;
      border-radius: 6px;
    }
    .editable-title:focus { background: var(--surface); }

    .editable-artist {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      width: 100%;
      outline: none;
      margin-top: 2px;
    }

    /* Controles principales */
    .actions-row {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 20px;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-shuffle {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-shuffle.active {
      border-color: #fff;
      background: #222;
    }

    /* Lista de Tracks */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      border-radius: 8px;
      transition: 0.15s;
      gap: 10px;
    }
    .track-item:hover { background: var(--surface); }
    .track-item.playing { background: var(--surface-hover); }

    .track-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .track-num {
      color: var(--text-muted);
      font-size: 13px;
      width: 22px;
      text-align: center;
      cursor: pointer;
    }
    .track-item.playing .track-num { color: #fff; font-weight: bold; }

    .track-name-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      width: 100%;
      outline: none;
      text-overflow: ellipsis;
    }
    .track-item.playing .track-name-input { font-weight: 600; }

    .track-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
    }
    .icon-btn:hover { color: var(--text); }

    /* Botón Subida Directa */
    .upload-box {
      margin-top: 24px;
    }

    /* Mini Reproductor Fijo Abajo */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 20px 22px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 100;
    }
    .player-bar.visible { display: flex; }

    .player-inner {
      width: 100%;
      max-width: 480px;
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: #fff;
      width: 0%;
      border-radius: 2px;
    }

    .player-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .now-playing-info {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 60%;
    }
    .now-playing-info img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #222;
    }
    .now-playing-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transport-btns {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .transport-btns button {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Barra superior -->
  <div class="top-bar">
    <select id="projectSelect" class="btn-ghost" onchange="loadProject(this.value)"></select>
    <div style="display:flex; gap:8px;">
      <button class="btn-ghost" onclick="createNewProject()">+ Proyecto</button>
      <button class="btn-ghost" onclick="shareProject()">Compartir</button>
    </div>
  </div>

  <!-- Cabecera Proyecto -->
  <div class="project-header">
    <div class="cover-wrapper" onclick="document.getElementById('coverInput').click()">
      <img id="coverImg" style="display:none;" />
      <div id="coverPlaceholder" class="cover-placeholder">
        <span>+ Portada</span>
        <span style="font-size:11px;">(1:1 Cuadrada)</span>
      </div>
    </div>
    <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="uploadCover(event)" />

    <input type="text" id="projectTitle" class="editable-title" value="Cargando..." onchange="updateProjectMeta()" />
    <input type="text" id="projectArtist" class="editable-artist" value="Artista" onchange="updateProjectMeta()" />

    <div class="actions-row">
      <button class="btn-primary" onclick="playFromIndex(0)">▶ Play</button>
      <button class="btn-shuffle" id="shuffleBtn" onclick="toggleShuffle()">🔀 Aleatorio</button>
    </div>
  </div>

  <!-- Lista de canciones -->
  <div id="trackList" class="track-list"></div>

  <!-- Subida directa desde el dispositivo (solo MP3 y WAV) -->
  <div class="upload-box">
    <input 
      type="file" 
      id="audioFileInput" 
      accept=".mp3,.wav,audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave" 
      multiple 
      style="display:none;" 
      onchange="uploadFilesFromDevice(event)" 
    />
    <button class="btn-primary" style="width:100%;" id="uploadBtn" onclick="document.getElementById('audioFileInput').click()">
      + Subir MP3 o WAV
    </button>
  </div>
</div>

<!-- Reproductor Inferior -->
<div class="player-bar" id="playerBar">
  <div class="player-inner">
    <div class="progress-container" onclick="seekAudio(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="player-controls">
      <div class="now-playing-info">
        <img id="playerCover" src="" />
        <div class="now-playing-title" id="playerTitle">Seleccioná un track</div>
      </div>
      <div class="transport-btns">
        <button onclick="prevTrack()">⏮</button>
        <button id="playPauseBtn" onclick="togglePlay()">⏸</button>
        <button onclick="nextTrack()">⏭</button>
      </div>
    </div>
  </div>
</div>

<audio id="audioEl" crossorigin="anonymous"></audio>

<script>
  // ==========================================
  // CREDENCIALES CONFIGURADAS
  // ==========================================
  const SUPABASE_URL = 'https://pmxtljgnnvzxyanesvqu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_CkTeNzIdf8c3Du2EiguLZg_cgdCD8Px';
  const GOOGLE_DRIVE_API_KEY = 'AIzaSyCNouqYL6YaZ044Lqp290bTqIcUXKEW8r8';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzx5cQTCOY-UGcKKj8m8v-Zn_KaZfFDM9gXWY5aNbRbHhyHkhnbsIGUf-EUukKccnbuGw/exec';
  // ==========================================

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const audio = document.getElementById('audioEl');

  let currentProject = null;
  let tracks = [];
  let currentIndex = -1;
  let isShuffle = false;

  async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const sharedProjectId = urlParams.get('p');

    const { data: projects } = await db.from('projects').select('*').order('created_at', { ascending: false });

    const select = document.getElementById('projectSelect');
    select.innerHTML = '';

    if (!projects || projects.length === 0) {
      await createNewProject('Maquetas 2026');
      return;
    }

    projects.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.title;
      select.appendChild(opt);
    });

    const initialId = sharedProjectId || projects[0].id;
    select.value = initialId;
    await loadProject(initialId);
  }

  async function loadProject(projectId) {
    const { data: project } = await db.from('projects').select('*').eq('id', projectId).single();
    if (!project) return;
    currentProject = project;

    document.getElementById('projectTitle').value = project.title;
    document.getElementById('projectArtist').value = project.artist || '';

    const coverImg = document.getElementById('coverImg');
    const placeholder = document.getElementById('coverPlaceholder');
    if (project.cover_url) {
      coverImg.src = project.cover_url;
      coverImg.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      coverImg.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    const { data: trackData } = await db.from('tracks').select('*').eq('project_id', projectId).order('track_order', { ascending: true });
    tracks = trackData || [];
    renderTracks();
  }

  function renderTracks() {
    const list = document.getElementById('trackList');
    list.innerHTML = '';

    tracks.forEach((t, idx) => {
      const div = document.createElement('div');
      div.className = `track-item ${idx === currentIndex ? 'playing' : ''}`;
      div.innerHTML = `
        <div class="track-left">
          <span class="track-num" onclick="playFromIndex(${idx})">${idx === currentIndex && !audio.paused ? '🔊' : idx + 1}</span>
          <input class="track-name-input" value="${t.title}" onchange="renameTrack('${t.id}', this.value)" />
        </div>
        <div class="track-actions">
          <button class="icon-btn" onclick="playFromIndex(${idx})">▶</button>
          <button class="icon-btn" onclick="deleteTrack('${t.id}')">✕</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  // Subida directa desde el celular/PC a Google Drive vía Apps Script
  async function uploadFilesFromDevice(event) {
    const files = Array.from(event.target.files);
    if (!files.length || !currentProject) return;

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = file.name.split('.').pop().toLowerCase();

      if (ext !== 'mp3' && ext !== 'wav') {
        alert(`El archivo "${file.name}" no es MP3 ni WAV y fue omitido.`);
        continue;
      }

      btn.textContent = `Subiendo ${i + 1} de ${files.length}...`;

      try {
        const base64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(file);
        });

        const mimeType = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            fileName: file.name,
            mimeType: mimeType,
            base64: base64
          })
        });

        const result = await response.json();

        if (result.status === 'ok') {
          const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
          await db.from('tracks').insert({
            project_id: currentProject.id,
            title: cleanTitle,
            drive_file_id: result.fileId,
            track_order: tracks.length + i
          });
        } else {
          alert('Error subiendo ' + file.name + ': ' + result.message);
        }
      } catch (err) {
        alert('Error de conexión subiendo ' + file.name + ' (verificá que el WAV no supere los 35 MB).');
      }
    }

    btn.disabled = false;
    btn.textContent = '+ Subir MP3 o WAV';
    event.target.value = '';
    await loadProject(currentProject.id);
  }

  async function renameTrack(trackId, newTitle) {
    if (!newTitle.trim()) return;
    await db.from('tracks').update({ title: newTitle.trim() }).eq('id', trackId);
  }

  async function deleteTrack(trackId) {
    if (!confirm('¿Quitar este track de la playlist?')) return;
    await db.from('tracks').delete().eq('id', trackId);
    await loadProject(currentProject.id);
  }

  async function updateProjectMeta() {
    const title = document.getElementById('projectTitle').value.trim();
    const artist = document.getElementById('projectArtist').value.trim();
    if (!title) return;
    await db.from('projects').update({ title, artist }).eq('id', currentProject.id);
    const select = document.getElementById('projectSelect');
    select.options[select.selectedIndex].textContent = title;
  }

  async function createNewProject(defaultName) {
    const title = defaultName || prompt('Nombre del nuevo proyecto:');
    if (!title) return;
    const { data } = await db.from('projects').insert({ title }).select().single();
    if (data) {
      window.history.replaceState({}, '', `?p=${data.id}`);
      await init();
    }
  }

  async function uploadCover(event) {
    const file = event.target.files[0];
    if (!file || !currentProject) return;

    const filePath = `${currentProject.id}-${Date.now()}.jpg`;
    const { error } = await db.storage.from('covers').upload(filePath, file);
    if (error) {
      alert('Error subiendo portada: ' + error.message);
      return;
    }

    const { data: publicUrlData } = db.storage.from('covers').getPublicUrl(filePath);
    await db.from('projects').update({ cover_url: publicUrlData.publicUrl }).eq('id', currentProject.id);
    await loadProject(currentProject.id);
  }

  function playFromIndex(idx) {
    if (tracks.length === 0) return;
    currentIndex = idx;
    const track = tracks[currentIndex];

    audio.src = `https://www.googleapis.com/drive/v3/files/${track.drive_file_id}?alt=media&key=${GOOGLE_DRIVE_API_KEY}`;
    audio.play();

    document.getElementById('playerBar').classList.add('visible');
    document.getElementById('playerTitle').textContent = track.title;
    document.getElementById('playerCover').src = currentProject.cover_url || '';
    document.getElementById('playPauseBtn').textContent = '⏸';
    renderTracks();
    updateMediaSession(track);
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play();
      document.getElementById('playPauseBtn').textContent = '⏸';
    } else {
      audio.pause();
      document.getElementById('playPauseBtn').textContent = '▶';
    }
    renderTracks();
  }

  function toggleShuffle() {
    isShuffle = !isShuffle;
    const btn = document.getElementById('shuffleBtn');
    btn.classList.toggle('active', isShuffle);
    if (isShuffle && audio.paused && tracks.length > 0) {
      nextTrack();
    }
  }

  function nextTrack() {
    if (tracks.length === 0) return;
    if (isShuffle && tracks.length > 1) {
      let rand;
      do {
        rand = Math.floor(Math.random() * tracks.length);
      } while (rand === currentIndex);
      playFromIndex(rand);
    } else {
      playFromIndex((currentIndex + 1) % tracks.length);
    }
  }

  function prevTrack() {
    if (tracks.length === 0) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
    } else {
      playFromIndex((currentIndex - 1 + tracks.length) % tracks.length);
    }
  }

  audio.addEventListener('ended', nextTrack);

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
  });

  function seekAudio(e) {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  }

  function updateMediaSession(track) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: currentProject.artist || 'Maqueta',
        album: currentProject.title,
        artwork: currentProject.cover_url ? [{ src: currentProject.cover_url, sizes: '512x512', type: 'image/jpeg' }] : []
      });
      navigator.mediaSession.setActionHandler('play', togglePlay);
      navigator.mediaSession.setActionHandler('pause', togglePlay);
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    }
  }

  function shareProject() {
    const url = `${window.location.origin}${window.location.pathname}?p=${currentProject.id}`;
    navigator.clipboard.writeText(url);
    alert('Link copiado para compartir con tus amigos:\n' + url);
  }

  init();
</script>
</body>
</html>
