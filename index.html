<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="1N1H Maquetas" />
  <title>1N1H Maquetas</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --surface: #242424;
      --surface-light: #2f2f2f;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --accent-yellow: #e5ff00;
      --accent-green: #1db954;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 125px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 16px 20px;
    }

    /* Top Bar con botones circulares */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      position: relative;
    }
    .circle-btn:active { transform: scale(0.93); background: var(--surface-light); }
    .circle-btn.active { background: #ffffff; color: #000000; }
    .circle-btn.downloaded { background: rgba(29, 185, 84, 0.2); color: var(--accent-green); }

    .badge-one {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 9px;
      font-weight: 800;
      background: #000;
      color: #fff;
      border-radius: 50%;
      width: 12px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-right-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Buscador desplegable */
    .search-bar {
      display: none;
      margin-bottom: 16px;
    }
    .search-bar.open { display: block; }
    .search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    /* Barra de estado de descarga offline */
    .offline-banner {
      display: none;
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .offline-banner.visible { display: flex; }

    /* Portada con disco de vinilo asomando */
    .cover-stage {
      position: relative;
      width: 265px;
      height: 265px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
    }

    .vinyl-disc {
      position: absolute;
      right: -24px;
      width: 245px;
      height: 245px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        #111 0%, #111 18%,
        #4a4a4a 19%, #222 20%,
        #383838 35%, #181818 50%,
        #444 65%, #1c1c1c 80%,
        #555 95%, #222 100%
      );
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 1;
      transition: transform 0.6s ease;
    }
    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 45deg, transparent 0deg, rgba(255,255,255,0.18) 40deg, transparent 90deg, rgba(255,255,255,0.12) 210deg, transparent 270deg);
    }

    .cover-box {
      position: relative;
      width: 265px;
      height: 265px;
      border-radius: 16px;
      background: #000;
      overflow: hidden;
      z-index: 2;
      box-shadow: 0 14px 34px rgba(0,0,0,0.65);
      cursor: pointer;
    }
    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      gap: 6px;
      background: #1a1a1a;
    }

    /* Info del proyecto + botones de control principales */
    .project-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .project-titles {
      flex: 1;
      min-width: 0;
    }

    .project-title {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .project-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-controls-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .big-play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .big-play-btn:active { transform: scale(0.93); }

    /* Botón "+ Add tracks" */
    .add-tracks-btn {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
      transition: background 0.15s;
    }
    .add-tracks-btn:active { background: var(--surface-light); }
    .add-tracks-btn:disabled { opacity: 0.75; cursor: wait; }

    /* Lista de Tracks */
    .track-list {
      display: flex;
      flex-direction: column;
    }

    .track-row {
      display: flex;
      align-items: center;
      padding: 11px 6px;
      gap: 12px;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .track-row:active { background: rgba(255,255,255,0.06); }
    .track-row.active { background: rgba(255,255,255,0.04); }

    .track-index {
      width: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Barras de ecualizador animadas cuando suena */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }
    .eq-bars span {
      width: 2.5px;
      background: var(--accent-yellow);
      border-radius: 2px;
      animation: eq 0.8s infinite ease-in-out;
    }
    .eq-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .eq-bars span:nth-child(2) { height: 14px; animation-delay: 0.2s; }
    .eq-bars span:nth-child(3) { height: 9px; animation-delay: 0.4s; }
    .eq-bars span:nth-child(4) { height: 12px; animation-delay: 0.1s; }
    .eq-bars.paused span { animation: none; height: 5px; background: #fff; }

    @keyframes eq {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .track-row.active .track-title {
      font-weight: 700;
      color: #ffffff;
    }

    .track-sub-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .offline-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-green);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .track-dots-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .track-dots-btn:active { color: #fff; }

    /* Cápsula Reproductor Flotante Inferior Completa */
    .floating-player {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 446px;
      background: rgba(32, 32, 32, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 34px;
      padding: 8px 12px 8px 8px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.8);
      z-index: 90;
    }
    .floating-player.visible { display: flex; }

    .mini-disc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
      cursor: pointer;
    }
    .mini-disc.spinning {
      animation: spin 10s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .mini-meta {
      width: 98px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .mini-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .mini-time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Waveform interactivo amarillo */
    .waveform-wrap {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
      touch-action: none;
      padding: 4px 0;
    }
    .wave-bar {
      flex: 1;
      background: #555;
      border-radius: 2px;
      transition: background 0.08s;
    }
    .wave-bar.played {
      background: var(--accent-yellow);
    }

    /* Botones de Pausa y Siguiente en el reproductor inferior */
    .mini-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .mini-ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .mini-ctrl-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.18);
    }

    /* Modal / Action Sheet estilo iOS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }

    .action-sheet {
      width: 100%;
      max-width: 460px;
      background: #1e1e1e;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      margin: 0 auto 10px;
      flex-shrink: 0;
    }
    .sheet-header {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-btn {
      width: 100%;
      background: var(--surface);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }
    .sheet-btn.danger { color: #ff453a; }
    .sheet-btn:active { background: var(--surface-light); }
  </style>
</head>
<body>

<div class="container">
  <!-- Barra superior -->
  <div class="top-bar">
    <button class="circle-btn" onclick="openProjectsSheet()" title="Cambiar proyecto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div class="top-right-group">
      <!-- Botón Descargar Playlist Offline -->
      <button class="circle-btn" id="downloadOfflineBtn" onclick="downloadEntirePlaylist()" title="Guardar playlist offline">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="circle-btn" onclick="shareProject()" title="Copiar link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </button>
      <button class="circle-btn" id="searchToggleBtn" onclick="toggleSearch()" title="Buscar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <button class="circle-btn" onclick="openProjectMenu()" title="Opciones del proyecto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </div>

  <!-- Banner progreso descarga offline -->
  <div class="offline-banner" id="offlineBanner">
    <span id="offlineBannerText">Descargando playlist...</span>
  </div>

  <!-- Buscador -->
  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Buscar track en este proyecto..." oninput="renderTracks()" />
  </div>

  <!-- Portada cuadrada + Vinilo -->
  <div class="cover-stage">
    <div class="vinyl-disc"></div>
    <div class="cover-box" onclick="document.getElementById('coverInput').click()">
      <img id="coverImg" style="display:none;" />
      <div id="coverPlaceholder" class="cover-placeholder">
        <span>+ Portada</span>
      </div>
    </div>
    <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="uploadCover(event)" />
  </div>

  <!-- Título, subtítulo y controles principales (Repetir, Aleatorio, Play/Pausa) -->
  <div class="project-meta-row">
    <div class="project-titles">
      <div class="project-title" id="projectTitleDisplay">Cargando...</div>
      <div class="project-subtitle" id="projectSubtitleDisplay">0 tracks</div>
    </div>
    <div class="play-controls-cluster">
      <button class="circle-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repetir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        <span id="repeatOneBadge" class="badge-one" style="display:none;">1</span>
      </button>
      <button class="circle-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aleatorio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>
      <button class="big-play-btn" id="mainPlayBtn" onclick="handleMainPlay()" title="Reproducir / Pausar">
        <svg id="mainPlayIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- Botón "+ Add tracks" -->
  <input 
    type="file" 
    id="audioFileInput" 
    accept=".mp3,.wav,audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave" 
    multiple 
    style="display:none;" 
    onchange="uploadFilesFromDevice(event)" 
  />
  <button class="add-tracks-btn" id="uploadBtn" onclick="document.getElementById('audioFileInput').click()">
    <span>+ Add tracks</span>
  </button>

  <!-- Lista de canciones -->
  <div id="trackList" class="track-list"></div>
</div>

<!-- Reproductor Flotante Inferior con Botón de Pausa/Play y Siguiente -->
<div class="floating-player" id="floatingPlayer">
  <img id="miniCover" class="mini-disc" src="icon.png" onclick="togglePlay()" />
  <div class="mini-meta" onclick="togglePlay()">
    <div class="mini-title" id="miniTitle">Track</div>
    <div class="mini-time" id="miniTime">0:00 / 0:00</div>
  </div>
  <div class="waveform-wrap" id="waveformWrap"></div>
  <div class="mini-controls">
    <button class="mini-ctrl-btn" id="miniPlayPauseBtn" onclick="togglePlay()" title="Pausar / Reproducir">
      <svg id="miniPlayPauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
    </button>
    <button class="mini-ctrl-btn" onclick="nextTrack()" title="Siguiente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
    </button>
  </div>
</div>

<!-- Action Sheet (Menú de 3 puntitos) -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
  <div class="action-sheet" id="actionSheet" onclick="event.stopPropagation()"></div>
</div>

<audio id="audioEl" playsinline preload="auto"></audio>

<script>
  const SUPABASE_URL = 'https://pmxtljgnnvzxyanesvqu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_CkTeNzIdf8c3Du2EiguLZg_cgdCD8Px';
  const GOOGLE_DRIVE_API_KEY = 'AIzaSyCNouqYL6YaZ044Lqp290bTqIcUXKEW8r8';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzx5cQTCOY-UGcKKj8m8v-Zn_KaZfFDM9gXWY5aNbRbHhyHkhnbsIGUf-EUukKccnbuGw/exec';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const audio = document.getElementById('audioEl');

  let allProjects = [];
  let currentProject = null;
  let tracks = [];
  let currentIndex = -1;
  let isShuffle = false;
  let repeatMode = 0; // 0 = off, 1 = repeat all, 2 = repeat one
  let isLoadingTrack = false;
  let isDownloadingOffline = false;
  let activePlayRequestId = 0;

  // ==========================================
  // BASE DE DATOS OFFLINE (IndexedDB para guardar Blobs de audio reales)
  // ==========================================
  const IDB_NAME = '1n1h_offline_db';
  const IDB_STORE = 'audio_blobs';
  const memoryBlobUrls = {};
  const inFlightDownloads = {};
  const offlineSavedSet = new Set();

  function openAudioDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('No IndexedDB'));
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const idb = e.target.result;
        if (!idb.objectStoreNames.contains(IDB_STORE)) {
          idb.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function getBlobFromIDB(fileId) {
    try {
      const idb = await openAudioDB();
      return await new Promise((resolve, reject) => {
        const tx = idb.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(fileId);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    } catch (e) {
      return null;
    }
  }

  async function saveBlobToIDB(fileId, blob) {
    try {
      const idb = await openAudioDB();
      await new Promise((resolve, reject) => {
        const tx = idb.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(blob, fileId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      offlineSavedSet.add(fileId);
    } catch (e) {}
  }

  async function deleteBlobFromIDB(fileId) {
    try {
      const idb = await openAudioDB();
      await new Promise((resolve) => {
        const tx = idb.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(fileId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
      offlineSavedSet.delete(fileId);
    } catch (e) {}
  }

  async function syncOfflineStatus() {
    try {
      const idb = await openAudioDB();
      const keys = await new Promise((resolve) => {
        const tx = idb.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
      const keySet = new Set(keys);
      offlineSavedSet.clear();
      tracks.forEach(t => {
        if (keySet.has(t.drive_file_id)) offlineSavedSet.add(t.drive_file_id);
      });
      const dlBtn = document.getElementById('downloadOfflineBtn');
      const allSaved = tracks.length > 0 && tracks.every(t => offlineSavedSet.has(t.drive_file_id));
      dlBtn.classList.toggle('downloaded', allSaved);
    } catch (e) {}
  }

  // Descarga tolerante a fallos (con acknowledgeAbuse=true para WAVs grandes >25MB)
  async function fetchDriveAudioBlob(fileId) {
    // URL principal con acknowledgeAbuse=true (evita error 403 de escaneo de virus en WAVs pesados)
    const primaryUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&acknowledgeAbuse=true&key=${GOOGLE_DRIVE_API_KEY}`;

    let res = await fetch(primaryUrl, { mode: 'cors', credentials: 'omit' });

    // Si falla por permisos del archivo, pedimos al Apps Script que lo haga público y reintentamos
    if (!res.ok) {
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'makePublic', fileId: fileId })
        });
        res = await fetch(primaryUrl, { mode: 'cors', credentials: 'omit' });
      } catch (e) {}
    }

    if (!res.ok) {
      let errDetail = `HTTP ${res.status}`;
      try {
        const errJson = await res.json();
        if (errJson?.error?.message) errDetail = errJson.error.message;
      } catch (e) {}
      throw new Error(errDetail);
    }

    const rawBlob = await res.blob();
    // Asegurar MIME type de audio válido para que iOS/Chrome nunca lo rechacen
    if (!rawBlob.type || rawBlob.type === 'application/octet-stream') {
      return new Blob([rawBlob], { type: 'audio/wav' });
    }
    return rawBlob;
  }

  async function getLocalPlayableUrl(fileId) {
    if (memoryBlobUrls[fileId]) return memoryBlobUrls[fileId];
    if (inFlightDownloads[fileId]) return inFlightDownloads[fileId];

    inFlightDownloads[fileId] = (async () => {
      // 1. Revisar si ya está guardado en IndexedDB del teléfono/PC
      let blob = await getBlobFromIDB(fileId);

      // 2. Si no está en disco, descargarlo de Google Drive y guardarlo en IndexedDB
      if (!blob || blob.size === 0) {
        blob = await fetchDriveAudioBlob(fileId);
        await saveBlobToIDB(fileId, blob);
      } else {
        offlineSavedSet.add(fileId);
      }

      const blobUrl = URL.createObjectURL(blob);
      memoryBlobUrls[fileId] = blobUrl;
      delete inFlightDownloads[fileId];
      return blobUrl;
    })();

    try {
      return await inFlightDownloads[fileId];
    } catch (err) {
      delete inFlightDownloads[fileId];
      throw err;
    }
  }

  // Pre-carga silenciosa del siguiente track para que no haya pausa entre canciones
  function preloadUpcomingTracks(fromIdx) {
    if (tracks.length <= 1) return;
    const nextIdx = (fromIdx + 1) % tracks.length;
    const nextTrackObj = tracks[nextIdx];
    if (nextTrackObj && !memoryBlobUrls[nextTrackObj.drive_file_id] && !inFlightDownloads[nextTrackObj.drive_file_id]) {
      getLocalPlayableUrl(nextTrackObj.drive_file_id)
        .then(() => {
          syncOfflineStatus();
          renderTracks();
        })
        .catch(() => {});
    }
  }

  async function downloadEntirePlaylist() {
    if (isDownloadingOffline || tracks.length === 0) return;

    const allAlreadySaved = tracks.every(t => offlineSavedSet.has(t.drive_file_id));
    if (allAlreadySaved) {
      if (confirm('Esta playlist ya está guardada offline en tu dispositivo. ¿Querés borrar los audios descargados para liberar espacio?')) {
        for (const t of tracks) {
          await deleteBlobFromIDB(t.drive_file_id);
        }
        await syncOfflineStatus();
        renderTracks();
      }
      return;
    }

    isDownloadingOffline = true;
    const banner = document.getElementById('offlineBanner');
    const bannerText = document.getElementById('offlineBannerText');
    banner.classList.add('visible');

    let successCount = 0;
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if (offlineSavedSet.has(t.drive_file_id)) {
        successCount++;
        continue;
      }

      bannerText.textContent = `Descargando ${i + 1} de ${tracks.length}: ${t.title}...`;
      try {
        await getLocalPlayableUrl(t.drive_file_id);
        successCount++;
        renderTracks();
      } catch (err) {
        console.warn('No se pudo cachear:', t.title, err);
      }
    }

    isDownloadingOffline = false;
    bannerText.textContent = `✓ ${successCount}/${tracks.length} tracks listos para escuchar sin conexión`;
    await syncOfflineStatus();
    renderTracks();
    setTimeout(() => banner.classList.remove('visible'), 3500);
  }

  // ==========================================
  // FORMA DE ONDA Y CONTROLES DE TIEMPO
  // ==========================================
  const waveHeights = [25, 45, 70, 40, 85, 60, 30, 90, 100, 65, 50, 80, 95, 45, 60, 75, 40, 85, 55, 35, 70, 90, 50, 65, 80, 40, 60, 30];
  function buildWaveform() {
    const wrap = document.getElementById('waveformWrap');
    wrap.innerHTML = '';
    waveHeights.forEach((h) => {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      bar.style.height = h + '%';
      wrap.appendChild(bar);
    });
  }
  buildWaveform();

  const waveWrap = document.getElementById('waveformWrap');
  let isSeeking = false;

  function formatSeconds(sec) {
    if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function updateTimeDisplay() {
    const cur = formatSeconds(audio.currentTime);
    const dur = formatSeconds(audio.duration);
    document.getElementById('miniTime').textContent = `${cur} / ${dur}`;
  }

  function applySeekFromClientX(clientX) {
    if (!audio.duration || isNaN(audio.duration)) return;
    const rect = waveWrap.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    audio.currentTime = pct * audio.duration;
    updateWaveformProgress(pct);
    updateTimeDisplay();
    updatePositionState();
  }

  waveWrap.addEventListener('pointerdown', (e) => {
    isSeeking = true;
    waveWrap.setPointerCapture(e.pointerId);
    applySeekFromClientX(e.clientX);
  });
  waveWrap.addEventListener('pointermove', (e) => {
    if (isSeeking) applySeekFromClientX(e.clientX);
  });
  waveWrap.addEventListener('pointerup', (e) => {
    if (isSeeking) {
      isSeeking = false;
      waveWrap.releasePointerCapture(e.pointerId);
    }
  });

  function updateWaveformProgress(pct) {
    const bars = document.querySelectorAll('.wave-bar');
    const activeCount = Math.floor(pct * bars.length);
    bars.forEach((b, i) => {
      b.classList.toggle('played', i <= activeCount && pct > 0);
    });
  }

  // ==========================================
  // CARGA DE PROYECTO Y LISTA DE TRACKS
  // ==========================================
  async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const sharedProjectId = urlParams.get('p');

    const { data: projects } = await db.from('projects').select('*').order('created_at', { ascending: false });
    allProjects = projects || [];

    if (allProjects.length === 0) {
      await createNewProject('1N1H Maquetas');
      return;
    }

    const exists = allProjects.some(p => p.id === sharedProjectId);
    const initialId = (sharedProjectId && exists) ? sharedProjectId : allProjects[0].id;
    await loadProject(initialId);
  }

  async function loadProject(projectId) {
    const { data: project } = await db.from('projects').select('*').eq('id', projectId).single();
    if (!project) return;
    currentProject = project;

    document.getElementById('projectTitleDisplay').textContent = project.title;

    const coverImg = document.getElementById('coverImg');
    const placeholder = document.getElementById('coverPlaceholder');
    if (project.cover_url) {
      coverImg.src = project.cover_url;
      coverImg.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      coverImg.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    const { data: trackData } = await db.from('tracks').select('*').eq('project_id', projectId).order('track_order', { ascending: true });
    tracks = trackData || [];

    const artistText = project.artist ? `${project.artist} · ` : '';
    document.getElementById('projectSubtitleDisplay').textContent = `${artistText}${tracks.length} tracks`;

    await syncOfflineStatus();
    renderTracks();
  }

  function formatRelativeDate(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    const diffMs = Date.now() - date.getTime();
    const diffMins = Math.floor(diffMs / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}m ago`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h ago`;
    return date.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
  }

  function renderTracks() {
    const list = document.getElementById('trackList');
    const filter = document.getElementById('searchInput').value.toLowerCase().trim();
    list.innerHTML = '';

    tracks.forEach((t, idx) => {
      if (filter && !t.title.toLowerCase().includes(filter)) return;

      const isCurrent = idx === currentIndex;
      const isPaused = audio.paused;
      const isSavedOffline = offlineSavedSet.has(t.drive_file_id);

      const row = document.createElement('div');
      row.className = `track-row ${isCurrent ? 'active' : ''}`;
      row.onclick = () => playFromIndex(idx);

      const indexHtml = isCurrent
        ? `<div class="eq-bars ${isPaused ? 'paused' : ''}"><span></span><span></span><span></span><span></span></div>`
        : `${idx + 1}`;

      const offlineBadge = isSavedOffline ? `<span class="offline-dot" title="Disponible offline">↓</span>` : '';

      row.innerHTML = `
        <div class="track-index">${indexHtml}</div>
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-sub-row">
            ${offlineBadge}
            <span>${isLoadingTrack && isCurrent ? 'Cargando maqueta...' : formatRelativeDate(t.created_at)}</span>
          </div>
        </div>
        <button class="track-dots-btn" onclick="event.stopPropagation(); openTrackMenu(${idx})" title="Opciones">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      `;
      list.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // ==========================================
  // MOTOR DE REPRODUCCIÓN (Con desbloqueo iOS y Fallback)
  // ==========================================
  async function playFromIndex(idx) {
    if (tracks.length === 0 || idx < 0 || idx >= tracks.length) return;

    // Si tocás el mismo track que ya está cargado, reinicia desde 0:00 al instante
    if (idx === currentIndex && audio.src && !isLoadingTrack) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
      updateWaveformProgress(0);
      updateTimeDisplay();
      updatePositionState();
      syncPlayIcons();
      renderTracks();
      return;
    }

    const requestId = ++activePlayRequestId;
    currentIndex = idx;
    const track = tracks[currentIndex];
    const isAlreadyLocal = Boolean(memoryBlobUrls[track.drive_file_id] || offlineSavedSet.has(track.drive_file_id));
    isLoadingTrack = !isAlreadyLocal;

    // Pausar el anterior limpiamente antes de cargar el nuevo
    audio.pause();

    document.getElementById('floatingPlayer').classList.add('visible');
    document.getElementById('miniTitle').textContent = track.title;
    document.getElementById('miniTime').textContent = isLoadingTrack ? 'Cargando...' : '0:00 / 0:00';
    document.getElementById('miniCover').src = currentProject.cover_url || 'icon.png';
    updateWaveformProgress(0);
    syncPlayIcons();
    renderTracks();

    try {
      const localUrl = await getLocalPlayableUrl(track.drive_file_id);
      if (requestId !== activePlayRequestId) return;

      isLoadingTrack = false;
      audio.src = localUrl;
      audio.currentTime = 0;
      await audio.play();

      syncPlayIcons();
      renderTracks();
      updateMediaSession(track);
      updatePositionState();
      preloadUpcomingTracks(idx);
    } catch (err) {
      if (requestId !== activePlayRequestId) return;

      // Fallback directo si fetch() fue bloqueado por algún motivo externo
      try {
        const directFallbackUrl = `https://www.googleapis.com/drive/v3/files/${track.drive_file_id}?alt=media&acknowledgeAbuse=true&key=${GOOGLE_DRIVE_API_KEY}`;
        isLoadingTrack = false;
        audio.src = directFallbackUrl;
        audio.currentTime = 0;
        await audio.play();
        syncPlayIcons();
        renderTracks();
        updateMediaSession(track);
      } catch (fallbackErr) {
        isLoadingTrack = false;
        syncPlayIcons();
        renderTracks();
        document.getElementById('miniTime').textContent = 'Tocá ▶ para reproducir';
        if (fallbackErr.name !== 'NotAllowedError' && fallbackErr.name !== 'AbortError') {
          alert(`No se pudo cargar "${track.title}" (${err.message}).`);
        }
      }
    }
  }

  function handleMainPlay() {
    if (tracks.length === 0) return;
    if (currentIndex === -1) {
      if (isShuffle) nextTrack();
      else playFromIndex(0);
    } else {
      togglePlay();
    }
  }

  function togglePlay() {
    if (tracks.length === 0) return;
    if (currentIndex === -1) {
      playFromIndex(0);
      return;
    }
    if (!audio.src) {
      playFromIndex(currentIndex);
      return;
    }
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
    syncPlayIcons();
    renderTracks();
    updatePositionState();
  }

  function syncPlayIcons() {
    const isPlaying = !audio.paused && Boolean(audio.src);
    const pauseSvg = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
    const playSvg = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';

    document.getElementById('mainPlayIcon').innerHTML = isPlaying ? pauseSvg : playSvg;
    document.getElementById('miniPlayPauseIcon').innerHTML = isPlaying ? pauseSvg : playSvg;
    document.getElementById('miniCover').classList.toggle('spinning', isPlaying);
  }

  function toggleShuffle() {
    isShuffle = !isShuffle;
    document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
  }

  function toggleRepeat() {
    repeatMode = (repeatMode + 1) % 3;
    const btn = document.getElementById('repeatBtn');
    const badge = document.getElementById('repeatOneBadge');
    btn.classList.toggle('active', repeatMode > 0);
    badge.style.display = repeatMode === 2 ? 'flex' : 'none';
  }

  function nextTrack() {
    if (tracks.length === 0) return;
    if (isShuffle && tracks.length > 1) {
      let rand;
      do {
        rand = Math.floor(Math.random() * tracks.length);
      } while (rand === currentIndex);
      playFromIndex(rand);
    } else {
      const nextIdx = currentIndex + 1;
      if (nextIdx >= tracks.length && repeatMode === 0 && !isShuffle) {
        // Fin de la lista si Repeat está desactivado: vuelve al primero
        playFromIndex(0);
      } else {
        playFromIndex(nextIdx % tracks.length);
      }
    }
  }

  function prevTrack() {
    if (tracks.length === 0) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      updatePositionState();
    } else {
      playFromIndex((currentIndex - 1 + tracks.length) % tracks.length);
    }
  }

  audio.addEventListener('ended', () => {
    if (repeatMode === 2) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    } else {
      nextTrack();
    }
  });

  audio.addEventListener('play', () => { syncPlayIcons(); renderTracks(); updatePositionState(); });
  audio.addEventListener('pause', () => { syncPlayIcons(); renderTracks(); updatePositionState(); });
  audio.addEventListener('loadedmetadata', () => { updateTimeDisplay(); updatePositionState(); });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration || isSeeking) return;
    const pct = audio.currentTime / audio.duration;
    updateWaveformProgress(pct);
    updateTimeDisplay();
    updatePositionState();
  });

  function updatePositionState() {
    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
      if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
        try {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate || 1,
            position: Math.min(audio.currentTime || 0, audio.duration)
          });
        } catch (e) {}
      }
    }
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');

  function openTrackMenu(idx) {
    const track = tracks[idx];
    openModal(`
      <div class="sheet-header">${escapeHtml(track.title)}</div>
      <button class="sheet-btn" onclick="promptRenameTrack(${idx})">Renombrar track</button>

      ${idx < tracks.length - 1 ? `<button class="sheet-btn" onclick="moveTrackOrder(${idx}, 1)">↓ Bajar una posición</button>` : ''}
      <button class="sheet-btn" onclick="downloadSingleTrackFile(${idx})">Guardar archivo de audio</button>

  async function promptRenameTrack(idx) {
    closeModal();
    const track = tracks[idx];
    const newTitle = prompt('Nuevo nombre del track:', track.title);
    if (!newTitle || !newTitle.trim()) return;
    await db.from('tracks').update({ title: newTitle.trim() }).eq('id', track.id);
    await loadProject(currentProject.id);
    if (currentIndex === idx) {
      document.getElementById('miniTitle').textContent = newTitle.trim();
    }
  }

  async function moveTrackOrder(idx, direction) {
    closeModal();
    const targetIdx = idx + direction;
    if (targetIdx < 0 || targetIdx >= tracks.length) return;

    const trackA = tracks[idx];
    const trackB = tracks[targetIdx];

    await db.from('tracks').update({ track_order: targetIdx }).eq('id', trackA.id);
    await db.from('tracks').update({ track_order: idx }).eq('id', trackB.id);

    if (currentIndex === idx) currentIndex = targetIdx;
    else if (currentIndex === targetIdx) currentIndex = idx;

    await loadProject(currentProject.id);
  }

  async function downloadSingleTrackFile(idx) {
    closeModal();
    const track = tracks[idx];
    try {
      const blobUrl = await getLocalPlayableUrl(track.drive_file_id);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = track.title;
      document.body.appendChild(a);
      a.click();
      a.remove();
      await syncOfflineStatus();
      renderTracks();
    } catch (e) {
      alert('Error al descargar el archivo.');

    if (!confirm('¿Eliminar este track del proyecto?')) return;
    await db.from('tracks').delete().eq('id', trackId);

      audio.pause();
      audio.src = '';

      document.getElementById('floatingPlayer').classList.remove('visible');

  // ==========================================
  // SUBIDA DIRECTA CON GUARDADO OFFLINE AUTOMÁTICO
  // ==========================================
  function uploadBinaryWithProgress(uploadUrl, file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', uploadUrl, true);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress(Math.round((e.loaded / e.total) * 100));
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(JSON.parse(xhr.responseText));
        } else {
          reject(new Error('Error HTTP ' + xhr.status));
        }
      };
      xhr.onerror = () => reject(new Error('Error de red al subir a Google Drive'));
      xhr.send(file);
    });
  }

  async function uploadFilesFromDevice(event) {
    const files = Array.from(event.target.files);
    if (!files.length || !currentProject) return;

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = file.name.split('.').pop().toLowerCase();

      if (ext !== 'mp3' && ext !== 'wav') {
        alert(`El archivo "${file.name}" no es MP3 ni WAV.`);
        continue;
      }

      btn.textContent = `Preparando ${i + 1} de ${files.length}...`;

      try {
        const mimeType = ext === 'wav' ? 'audio/wav' : 'audio/mpeg';

        const initRes = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            fileName: file.name,
            mimeType: mimeType
          })
        });
        const initData = await initRes.json();

        if (initData.status !== 'ok' || !initData.uploadUrl) {
          throw new Error(initData.message || 'No se pudo iniciar la subida');
        }

        const driveFile = await uploadBinaryWithProgress(initData.uploadUrl, file, (pct) => {
          btn.textContent = `Subiendo ${i + 1}/${files.length}: ${pct}%`;
        });

        // Guardar también en el almacenamiento offline de este dispositivo para no tener que re-descargarlo
        await saveBlobToIDB(driveFile.id, file);
        memoryBlobUrls[driveFile.id] = URL.createObjectURL(file);

        const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
        await db.from('tracks').insert({
          project_id: currentProject.id,
          title: cleanTitle,
          drive_file_id: driveFile.id,
          track_order: tracks.length + i
        });

      } catch (err) {
        alert('Error subiendo ' + file.name + ': ' + err.message);
      }
    }

    btn.disabled = false;
    btn.textContent = '+ Add tracks';
    event.target.value = '';
    await loadProject(currentProject.id);
  }

  async function uploadCover(event) {
    const file = event.target.files[0];
    if (!file || !currentProject) return;

    const filePath = `${currentProject.id}-${Date.now()}.jpg`;
    const { error } = await db.storage.from('covers').upload(filePath, file);
    if (error) {
      alert('Error subiendo portada: ' + error.message);
      return;
    }

    const { data: publicUrlData } = db.storage.from('covers').getPublicUrl(filePath);
    await db.from('projects').update({ cover_url: publicUrlData.publicUrl }).eq('id', currentProject.id);
    await loadProject(currentProject.id);
  }

  function updateMediaSession(track) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: currentProject.artist || '1N1H',
        album: currentProject.title,
        artwork: currentProject.cover_url ? [{ src: currentProject.cover_url, sizes: '512x512', type: 'image/jpeg' }] : []
      });

      navigator.mediaSession.setActionHandler('play', () => {
        audio.play().catch(() => {});
        syncPlayIcons();
        renderTracks();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        audio.pause();
        syncPlayIcons();
        renderTracks();
      });
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);

      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.fastSeek && 'fastSeek' in audio) {
          audio.fastSeek(details.seekTime);
        } else {
          audio.currentTime = details.seekTime;
        }
        if (audio.duration) {
          updateWaveformProgress(audio.currentTime / audio.duration);
        }
        updateTimeDisplay();
        updatePositionState();
      });

      navigator.mediaSession.setActionHandler('seekbackward', (details) => {
        const skip = details.seekOffset || 10;
        audio.currentTime = Math.max(0, audio.currentTime - skip);
        updateTimeDisplay();
        updatePositionState();
      });

      navigator.mediaSession.setActionHandler('seekforward', (details) => {
        const skip = details.seekOffset || 10;
        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + skip);
        updateTimeDisplay();
        updatePositionState();
      });
    }
  }

  function shareProject() {
    const url = `${window.location.origin}${window.location.pathname}?p=${currentProject.id}`;
    navigator.clipboard.writeText(url);
    alert('Link copiado:\n' + url);
  }

  init();
</script>
